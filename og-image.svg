<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GrammarLift Open Graph Image</title>
  <desc id="desc">A modern educational card showing GrammarLift branding and English learning topics.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe6" />
      <stop offset="100%" stop-color="#d8e6ef" />
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a6c5a" />
      <stop offset="100%" stop-color="#cc5a2e" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1a2333" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <circle cx="140" cy="90" r="160" fill="#0a6c5a" opacity="0.12" />
  <circle cx="1130" cy="540" r="180" fill="#cc5a2e" opacity="0.12" />

  <g filter="url(#soft-shadow)">
    <rect x="88" y="78" width="1024" height="474" rx="32" fill="#ffffff" opacity="0.92" />
  </g>

  <rect x="128" y="120" width="84" height="84" rx="20" fill="url(#brand)" />
  <text x="170" y="173" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="34" font-weight="800" fill="#ffffff">GL</text>

  <text x="236" y="156" font-family="'Space Grotesk', Arial, sans-serif" font-size="24" font-weight="700" fill="#0a6c5a" letter-spacing="2">ENGLISH LEARNING STUDIO</text>
  <text x="128" y="248" font-family="'Fraunces', Georgia, serif" font-size="62" font-weight="800" fill="#1a2333">GrammarLift</text>
  <text x="128" y="304" font-family="'Space Grotesk', Arial, sans-serif" font-size="30" font-weight="600" fill="#4f5d73">Interactive Quizzes with Instant Explanations</text>

  <g font-family="'Space Grotesk', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a2333">
    <rect x="128" y="356" width="220" height="50" rx="25" fill="#e6f6ef" />
    <text x="238" y="389" text-anchor="middle">Grammar</text>

    <rect x="364" y="356" width="220" height="50" rx="25" fill="#ebf2fb" />
    <text x="474" y="389" text-anchor="middle">Vocabulary</text>

    <rect x="600" y="356" width="220" height="50" rx="25" fill="#fff1ea" />
    <text x="710" y="389" text-anchor="middle">Antonyms</text>

    <rect x="836" y="356" width="236" height="50" rx="25" fill="#f4ecff" />
    <text x="954" y="389" text-anchor="middle">Grammar Mistakes</text>
  </g>

  <rect x="128" y="448" width="420" height="52" rx="26" fill="url(#brand)" />
  <text x="338" y="482" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">25+ Questions Per Category</text>

  <text x="1110" y="594" text-anchor="end" font-family="'Space Grotesk', Arial, sans-serif" font-size="22" fill="#4f5d73">grammarlift.app</text>
</svg>
